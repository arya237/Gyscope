name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build Linux amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -o gyscope-linux-amd64 ./cmd/Gyscope

      - name: Install ARM64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Linux arm64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 1
          CC: aarch64-linux-gnu-gcc
        run: go build -o gyscope-linux-arm64 ./cmd/Gyscope

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gyscope-linux-amd64
            gyscope-linux-arm64